version: '3.8'
services:
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    restart: unless-stopped

  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - REDIS_HOST=redis
    depends_on:
      - redis